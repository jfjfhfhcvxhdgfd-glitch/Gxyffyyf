name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Validate Secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          $errors = @()
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { $errors += "RDP_PASSWORD missing" }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { $errors += "TAILSCALE_AUTH_KEY missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_URL)) { $errors += "CLOUD_URL missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_USER)) { $errors += "CLOUD_USER missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_PASS)) { $errors += "CLOUD_PASS missing" }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Secret eksik"
          }
          Write-Host "Secrets OK" -ForegroundColor Green

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $u = Get-LocalUser "Draghyper" -ErrorAction SilentlyContinue
          if (-not $u) { New-LocalUser "Draghyper" -Password $pass -PasswordNeverExpires:$true | Out-Null }
          else { Set-LocalUser "Draghyper" -Password $pass }
          Add-LocalGroupMember "Administrators" "Draghyper" -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 2 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force
          Write-Host "RDP OK"

      - name: Audio and Microphone
        shell: pwsh
        run: |
          $p = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $p -Force | Out-Null
          New-ItemProperty -Path $p -Name fDisableAudioCapture -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $p -Name fDisableAudioPlayback -PropertyType DWord -Value 0 -Force | Out-Null
          foreach ($s in @("AudioEndpointBuilder", "Audiosrv")) {
            $sv = Get-Service $s -ErrorAction SilentlyContinue
            if ($sv) { try { Set-Service $s -StartupType Automatic; Start-Service $s } catch {} }
          }
          gpupdate /target:computer /force
          Restart-Service TermService -Force
          Start-Sleep 3
          Write-Host "Audio OK"

      - name: Free Disk Space
        shell: pwsh
        run: |
          $paths = @($env:TEMP, "$env:WINDIR\Temp")
          foreach ($path in $paths) {
            if (Test-Path $path) { Get-ChildItem $path -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Disk cleaned"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          "TAILSCALE_EXE=$env:ProgramFiles\Tailscale\tailscale.exe" | Out-File $env:GITHUB_ENV -Append

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & $env:TAILSCALE_EXE up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="gh-$env:GITHUB_RUN_ID"
          Start-Sleep 5
          $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()
          "RDP_IP=$ip" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $ip"

      - name: Mount WebDAV Z Drive
        shell: pwsh
        env:
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          curl.exe -sL -o "$env:TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive "$env:TEMP\rclone.zip" "$env:TEMP\rclone" -Force
          $r = Get-ChildItem "$env:TEMP\rclone" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
          $exe = "$($r.FullName)\rclone.exe"
          $env:RCLONE_CONFIG_MYDRIVE_TYPE = "webdav"
          $env:RCLONE_CONFIG_MYDRIVE_URL = $env:CLOUD_URL
          $env:RCLONE_CONFIG_MYDRIVE_USER = $env:CLOUD_USER
          $env:RCLONE_CONFIG_MYDRIVE_PASS = $env:CLOUD_PASS
          $env:RCLONE_CONFIG_MYDRIVE_VENDOR = "other"
          Start-Process $exe -ArgumentList "mount mydrive: Z: --vfs-cache-mode writes --volname Cloud" -NoNewWindow -PassThru
          Start-Sleep 15
          if (Test-Path "Z:\") {
            Write-Host "WebDAV Z: OK" -ForegroundColor Green
            New-Item -ItemType Directory -Force "Z:\Downloads", "Z:\Temp" | Out-Null
            $dl = "C:\Users\Draghyper\Downloads"
            if (Test-Path $dl) { Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $dl "Z:\Downloads"
            $t = $env:TEMP
            if (Test-Path $t) { Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $t "Z:\Temp"
            Write-Host "Downloads redirected to Z:" -ForegroundColor Green
          } else {
            Write-Host "WARNING: Z: drive failed. Check CLOUD_URL/USER/PASS" -ForegroundColor Red
          }

      - name: Open Microsoft Store
        shell: pwsh
        run: |
          Start-Process "explorer.exe" -ArgumentList "shell:AppsFolder\Microsoft.WindowsStore_8wekyb3d8bbwe!App"
          Write-Host "Microsoft Store opened" -ForegroundColor Green

      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "RDP IP: $env:RDP_IP"
          Write-Host "User: Draghyper"
          Write-Host "Session open 6 hours"
          for ($i = 1; $i -le 360; $i++) { Start-Sleep 60 }