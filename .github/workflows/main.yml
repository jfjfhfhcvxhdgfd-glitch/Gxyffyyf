name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret eksik."
          }
          if ($env:RDP_PASSWORD.Length -lt 12 -or
              $env:RDP_PASSWORD -notmatch '[A-Z]' -or
              $env:RDP_PASSWORD -notmatch '[a-z]' -or
              $env:RDP_PASSWORD -notmatch '\d' -or
              $env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD en az 12 karakter; büyük harf, küçük harf, rakam ve sembol içermeli."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret eksik."
          }
          Write-Host "Gerekli secret kontrolleri tamamlandı."

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Draghyper" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name "Draghyper" `
              -Password $securePassword `
              -Description "RDP account" | Out-Null
          } else {
            Set-LocalUser -Name "Draghyper" -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpPath -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpPath -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -Name "RDP-Tailscale" `
              -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" `
              -DisplayName "RDP over Tailscale" `
              -Direction Inbound -Protocol TCP -LocalPort 3389 `
              -Action Allow | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "Windows RDP ayarları tamamlandı."

      - name: Enable RDP Audio and Microphone Redirection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null

          # 0 = ses kaydı/mikrofon yönlendirmesi engellenmesin
          New-ItemProperty -Path $policyPath `
            -Name fDisableAudioCapture -PropertyType DWord `
            -Value 0 -Force | Out-Null

          # 0 = ses çalma yönlendirmesi engellenmesin
          New-ItemProperty -Path $policyPath `
            -Name fDisableAudioPlayback -PropertyType DWord `
            -Value 0 -Force | Out-Null

          # Ses hizmetlerini etkinleştir ve başlat
          foreach ($serviceName in @("AudioEndpointBuilder", "Audiosrv")) {
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if ($null -ne $service) {
              try {
                Set-Service -Name $serviceName -StartupType Automatic -ErrorAction Stop
                Start-Service -Name $serviceName -ErrorAction Stop
                Write-Host "$serviceName başlatıldı."
              } catch {
                Write-Warning "$serviceName başlatılamadı: $($_.Exception.Message)"
              }
            }
          }

          # NOT: gpupdate kaldırıldı (takılma yapıyordu).
          # Kayıt defteri ilkeleri yazıldı, servis restart yeterli.
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 2
          Write-Host "Ses yönlendirme ilkeleri uygulandı."

      - name: Install Virtual Audio Cable (Safe Mode)
        shell: pwsh
        run: |
          # Bu adım hata verse veya takılsa bile iş akışı DEVAM EDER.
          $ErrorActionPreference = "Continue"
          $zipPath = "$env:TEMP\VBCable.zip"
          $extractPath = "$env:TEMP\VBCable"

          try {
            Write-Host "VB-Cable indiriliyor..."
            # curl.exe daha hızlıdır, 90 saniye zaman aşımı var
            curl.exe -sL --max-time 90 `
              -o $zipPath `
              "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip"

            if (-not (Test-Path $zipPath)) { throw "İndirme başarısız." }

            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

            Write-Host "Sanal ses sürücüsü kuruluyor..."
            $proc = Start-Process -FilePath "$extractPath\VBCABLE_Setup_x64.exe" `
              -ArgumentList "-i" -PassThru -NoNewWindow

            # En fazla 120 saniye bekle, takılırsa öldür ve devam et
            if (-not $proc.WaitForExit(120000)) {
              $proc.Kill()
              Write-Warning "VB-Cable kurulumu takıldı, işlem sonlandırıldı. Akış devam ediyor."
            }

            Restart-Service -Name "Audiosrv", "AudioEndpointBuilder" -Force -ErrorAction SilentlyContinue
            Write-Host "Sanal ses kartı kurulumu tamamlandı."
          } catch {
            Write-Warning "VB-Cable kurulamadı ama akış devam ediyor: $($_.Exception.Message)"
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:TEMP "tailscale-setup.msi"

          # curl.exe ile hızlı indirme
          curl.exe -sL --max-time 180 `
            -o $msi `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          if (-not (Test-Path $msi)) { throw "Tailscale indirilemedi." }

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale kurulumu başarısız. Kod: $($process.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw "Tailscale programı bulunamadı."
          }

          "TAILSCALE_EXE=$tailscale" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale kuruldu."

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $env:TAILSCALE_EXE up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale girişi başarısız. Auth key ve cihaz politikasını kontrol et."
          }

          Start-Sleep -Seconds 3
          $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IPv4 adresi alınamadı."
          }

          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "  BAGLANMAYA HAZIR! HEMEN RDP AC:"
          Write-Host "  IP    : $ip"
          Write-Host "  User  : Draghyper"
          Write-Host "=============================================="
          Write-Host ""

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "RDP oturumu 6 saate kadar açık tutulacak."
          Write-Host "Adres: $env:RDP_IP"
          Write-Host "Kullanıcı adı: Draghyper"
          Write-Host "Parola, GitHub RDP_PASSWORD secret değeridir."
          Write-Host "ONEMLI: Bu adimin bitmesini BEKLEME, IP gorununce hemen baglan."

          for ($i = 1; $i -le 360; $i++) {
            Write-Host "Bağlantı aktif. Geçen süre: $i dakika"
            Start-Sleep -Seconds 60
          }