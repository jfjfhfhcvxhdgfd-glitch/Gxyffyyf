name: RDP-TeraBox-Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Validate Secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          Write-Host "=== SECRET KONTROL ==="
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "RDP_PASSWORD eksik." }
          if ($env:RDP_PASSWORD.Length -lt 12 -or
              $env:RDP_PASSWORD -notmatch '[A-Z]' -or
              $env:RDP_PASSWORD -notmatch '[a-z]' -or
              $env:RDP_PASSWORD -notmatch '\d' -or
              $env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD en az 12 karakter; büyük harf, küçük harf, rakam ve sembol içermeli."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw "TAILSCALE_AUTH_KEY eksik." }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_COOKIE)) { throw "CLOUD_COOKIE (TeraBox ndus çerezi) eksik." }
          Write-Host "Tüm secret'lar hazır."

      - name: 2. Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Draghyper" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            New-LocalUser -Name "Draghyper" -Password $securePassword -Description "RDP account" | Out-Null
          } else {
            Set-LocalUser -Name "Draghyper" -Password $securePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member "Draghyper" -ErrorAction SilentlyContinue

          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpPath -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpPath -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          if (-not (Get-NetFirewallRule -Name "RDP-Tailscale" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" -DisplayName "RDP over Tailscale" `
              -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force
          Write-Host "RDP ayarları tamam."

      - name: 3. Enable RDP Audio and Microphone Redirection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name fDisableAudioCapture  -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name fDisableAudioPlayback -PropertyType DWord -Value 0 -Force | Out-Null

          foreach ($svc in @("AudioEndpointBuilder", "Audiosrv")) {
            $s = Get-Service -Name $svc -ErrorAction SilentlyContinue
            if ($null -ne $s) {
              try {
                Set-Service -Name $svc -StartupType Automatic -ErrorAction Stop
                Start-Service -Name $svc -ErrorAction Stop
                Write-Host "$svc başlatıldı."
              } catch { Write-Warning "$svc başlatılamadı: $($_.Exception.Message)" }
            }
          }

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 2
          Write-Host "Ses/mikrofon politikaları uygulandı."

      - name: 4. Install Virtual Audio Cable (Safe Mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $zipPath = "$env:TEMP\VBCable.zip"
          $extractPath = "$env:TEMP\VBCable"

          function Test-VirtualAudioDevice {
            $dev = Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue |
                   Where-Object { $_.FriendlyName -like "*CABLE*" -or $_.FriendlyName -like "*VB-Audio*" }
            return ($null -ne $dev -and @($dev).Count -gt 0)
          }

          try {
            Write-Host "VB-Cable indiriliyor..."
            curl.exe -sL --max-time 90 -o $zipPath "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip"
            if (-not (Test-Path $zipPath)) { throw "İndirme başarısız." }

            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
            $setup = Get-ChildItem -Path $extractPath -Filter "VBCABLE_Setup_x64.exe" -Recurse | Select-Object -First 1
            if (-not $setup) { throw "Kurulum dosyası bulunamadı." }

            Write-Host "Sanal ses sürücüsü kuruluyor..."
            $p1 = Start-Process -FilePath $setup.FullName -ArgumentList "-i" -WorkingDirectory $extractPath -PassThru
            if (-not $p1.WaitForExit(120000)) { $p1.Kill(); Write-Warning "Kurulum takıldı, sonlandırıldı." }

            Start-Sleep -Seconds 3
            Restart-Service -Name "Audiosrv","AudioEndpointBuilder" -Force -ErrorAction SilentlyContinue

            if (-not (Test-VirtualAudioDevice)) {
              Write-Warning "Aygıt görünmedi, ikinci deneme..."
              $p2 = Start-Process -FilePath $setup.FullName -ArgumentList "-i" -WorkingDirectory $extractPath -PassThru
              if (-not $p2.WaitForExit(120000)) { $p2.Kill() }
              Start-Sleep -Seconds 3
              Restart-Service -Name "Audiosrv","AudioEndpointBuilder" -Force -ErrorAction SilentlyContinue
            }

            Write-Host "=== MEVCUT SES AYGITLARI ==="
            Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue |
              Select-Object Status, FriendlyName | Format-Table -AutoSize

            if (Test-VirtualAudioDevice) { Write-Host "SANAL SES KARTI KURULDU." }
            else { Write-Warning "SANAL SES KARTI GÖRÜNMÜYOR." }
          } catch {
            Write-Warning "VB-Cable hatası: $($_.Exception.Message)"
          }

      - name: 5. Install Rclone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Rclone indiriliyor..."
          curl.exe -sL --max-time 120 -o "$env:TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          if (-not (Test-Path "$env:TEMP\rclone.zip")) { throw "Rclone indirilemedi." }

          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone" -Force
          $rcloneDir = Get-ChildItem -Path "$env:TEMP\rclone" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
          $rcloneExe = Join-Path $rcloneDir.FullName "rclone.exe"
          if (-not (Test-Path $rcloneExe)) { throw "Rclone bulunamadı." }

          $env:PATH += ";$($rcloneDir.FullName)"
          "RCLONE_EXE=$rcloneExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Rclone kuruldu."

      - name: 6. Mount TeraBox as Z: Drive (Cookie Method)
        shell: pwsh
        env:
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "TeraBox çerezi ile bağlanılıyor..."

          $env:RCLONE_CONFIG_MYCLOUD_TYPE = "terabox"
          $env:RCLONE_CONFIG_MYCLOUD_NDUS = $env:CLOUD_COOKIE

          Start-Process -FilePath $env:RCLONE_EXE -ArgumentList "mount mycloud: Z: --vfs-cache-mode writes --volname 'TeraBox 1TB'" -NoNewWindow -PassThru
          Start-Sleep -Seconds 15

          if (Test-Path "Z:\") {
            Write-Host "=============================================="
            Write-Host "  BASARILI! TeraBox Z: Sürücüsü olarak bağlandı."
            Write-Host "=============================================="
          } else {
            Write-Warning "Z: sürücüsü bağlanamadı. CLOUD_COOKIE (ndus) süresi dolmuş olabilir. Tarayıcıdan yenileyip tekrar ekle."
          }

      - name: 7. Redirect Downloads & Temp to TeraBox (Z:)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Klasörler TeraBox'a yönlendiriliyor..."

          New-Item -ItemType Directory -Force -Path "Z:\Downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "Z:\Temp" | Out-Null

          $userDownloads = "C:\Users\Draghyper\Downloads"
          if (Test-Path $userDownloads) { Remove-Item -Path $userDownloads -Recurse -Force -ErrorAction SilentlyContinue }
          cmd /c mklink /J $userDownloads "Z:\Downloads"

          $sysTemp = $env:TEMP
          if (Test-Path $sysTemp) { Remove-Item -Path $sysTemp -Recurse -Force -ErrorAction SilentlyContinue }
          cmd /c mklink /J $sysTemp "Z:\Temp"

          Write-Host "Indirmeler ve gecici dosyalar artik TeraBox'a (Z:) kaydedilecek. C: diski dolmayacak."

      - name: 8. Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:TEMP "tailscale-setup.msi"
          curl.exe -sL --max-time 180 -o $msi "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          if (-not (Test-Path $msi)) { throw "Tailscale indirilemedi." }

          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Tailscale kurulum hatası: $($process.ExitCode)" }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) { throw "Tailscale bulunamadı." }
          "TAILSCALE_EXE=$tailscale" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale kuruldu."

      - name: 9. Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Continue"
          $authKey = "$env:TAILSCALE_AUTH_KEY".Trim()

          if ($authKey -notmatch '^tskey-auth-') {
            Write-Error "HATA: Auth key 'tskey-auth-' ile başlamıyor. Doğru yerden al: https://login.tailscale.com/admin/settings/keys → Auth keys"
            throw "YANLIŞ ANAHTAR TİPİ."
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          $output = & $env:TAILSCALE_EXE up --auth-key="$authKey" --hostname="$hostname" 2>&1
          $exitCode = $LASTEXITCODE

          Write-Host "=== TAILSCALE ÇIKTISI ==="
          Write-Host $output
          Write-Host "Çıkış kodu: $exitCode"

          if ($exitCode -ne 0) {
            $outputStr = $output -join "`n"
            if ($outputStr -match 'invalid.*key') { Write-Error "Geçersiz anahtar. Yeni auth key al." }
            elseif ($outputStr -match 'expired') { Write-Error "Anahtarın süresi dolmuş." }
            elseif ($outputStr -match 'device approval') { Write-Error "Pre-approved işaretle." }
            throw "Tailscale bağlantısı başarısız."
          }

          Start-Sleep -Seconds 3
          $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ip)) { throw "Tailscale IP alınamadı." }
          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "  BAGLANMAYA HAZIR!"
          Write-Host "  TAILSCALE IP : $ip"
          Write-Host "  User         : Draghyper"
          Write-Host "  Pass         : GitHub RDP_PASSWORD secret'ı"
          Write-Host "  TeraBox Z:   : Bağlandı (indirmeler buraya)"
          Write-Host "=============================================="

      - name: 10. Maintain Connection
        shell: pwsh
        run: |
          Write-Host "RDP 6 saat açık kalacak. IP: $env:RDP_IP | User: Draghyper"
          Write-Host "Z: sürücüsü = TeraBox 1TB. Indirmeler otomatik oraya gider."
          Write-Host "Bu adımın bitmesini BEKLEME, IP görününce hemen bağlan."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
          }