# ============================================
# GEREKLI SECRET AYARLARI
# (GitHub → Settings → Secrets and variables → Actions)
# ============================================
# Secret Adı          | Ne Yazacaksın
# --------------------------------------------
# RDP_PASSWORD        | Güçlü şifre (örn: Draghyper2026!)
# TAILSCALE_AUTH_KEY  | Tailscale → Settings → Auth keys (API keys DEĞİL) → Generate → tskey-auth-k... ile başlayan
# CLOUD_COOKIE        | TeraBox'a giriş yap → F12 → Application → Cookies → ndus satırının Value'sunu kopyala
# ============================================

name: RDP-TeraBox-Ultimate-Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Secret Anahtarlarını Kontrol Et
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          Write-Host "=== SECRET KONTROL BASLADI ==="
          
          $hatalar = @()
          
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { 
            $hatalar += "RDP_PASSWORD eksik!"
          } else {
            Write-Host "[OK] RDP_PASSWORD bulundu."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { 
            $hatalar += "TAILSCALE_AUTH_KEY eksik!"
          } elseif ($env:TAILSCALE_AUTH_KEY -notmatch '^tskey-auth-') {
            $hatalar += "TAILSCALE_AUTH_KEY yanlis format! tskey-auth- ile baslamali."
          } else {
            Write-Host "[OK] TAILSCALE_AUTH_KEY bulundu."
          }

          if ([string]::IsNullOrWhiteSpace($env:CLOUD_COOKIE)) { 
            $hatalar += "CLOUD_COOKIE eksik!"
          } else {
            Write-Host "[OK] CLOUD_COOKIE bulundu."
          }

          if ($hatalar.Count -gt 0) {
            Write-Host "HATALAR:" -ForegroundColor Red
            $hatalar | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Secret eksik! GitHub Settings > Secrets kismindan ekle."
          }
          
          Write-Host "Tum secret'lar hazir!" -ForegroundColor Green

      - name: 2. Disk Temizleme ve RDP Aktiflestirme
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "=== DISK TEMIZLEME ==="
          Get-ChildItem -Path $env:TEMP, "$env:WINDIR\Temp" -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "[OK] Gecici dosyalar temizlendi."

          Write-Host "=== RDP AKTIFLESTIRME ==="
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1 -Force
          New-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name fDisableAudioCapture -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name fDisableAudioPlayback -Value 0 -PropertyType DWord -Force | Out-Null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Write-Host "[OK] RDP aktiflestirildi ve ayarlandi."

          Write-Host "=== KULLANICI OLUSTURMA ==="
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (!(Get-LocalUser "Draghyper" -ErrorAction SilentlyContinue)) { 
            New-LocalUser "Draghyper" -Password $pass -PasswordNeverExpires:$true | Out-Null 
          } else { 
            Set-LocalUser "Draghyper" -Password $pass 
          }
          Add-LocalGroupMember "Administrators" "Draghyper" -ErrorAction SilentlyContinue
          Restart-Service TermService -Force
          Write-Host "[OK] Draghyper kullanici hazir."

      - name: 3. VB-Cable ve Rclone Kurulumu
        shell: pwsh
        run: |
          Write-Host "=== VB-CABLE KURULUMU ==="
          curl.exe -sL -o "$env:TEMP\vb.zip" "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip"
          Expand-Archive "$env:TEMP\vb.zip" "$env:TEMP\vb" -Force
          $vb = Get-ChildItem "$env:TEMP\vb" -Filter "VBCABLE_Setup_x64.exe" -Recurse | Select-Object -First 1
          if ($vb) { 
            Start-Process $vb.FullName -ArgumentList "-i" -Wait 
            Write-Host "[OK] VB-Cable kuruldu."
          } else {
            Write-Host "VB-Cable kurulamadi, atlanıyor."
          }

          Write-Host "=== RCLONE KURULUMU ==="
          curl.exe -sL -o "$env:TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive "$env:TEMP\rclone.zip" "$env:TEMP\rclone" -Force
          $rcloneDir = Get-ChildItem "$env:TEMP\rclone" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
          $env:PATH += ";$($rcloneDir.FullName)"
          "RCLONE_EXE=$($rcloneDir.FullName)\rclone.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "[OK] Rclone kuruldu."

      - name: 4. TeraBox Z: Surucusu Baglama
        shell: pwsh
        env:
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          Write-Host "=== TERABOX BAGLANTISI ==="
          $env:RCLONE_CONFIG_MYCLOUD_TYPE = "terabox"
          $env:RCLONE_CONFIG_MYCLOUD_NDUS = $env:CLOUD_COOKIE
          
          Start-Process $env:RCLONE_EXE -ArgumentList "mount mycloud: Z: --vfs-cache-mode writes --volname 'TeraBox 1TB'" -NoNewWindow -PassThru
          Start-Sleep -Seconds 15
          
          if (Test-Path "Z:\") { 
            Write-Host "[OK] TeraBox Z: surucusune baglandi!" -ForegroundColor Green 
          } else { 
            Write-Host "[HATA] Z: baglanamadi. CLOUD_COOKIE kontrol et." -ForegroundColor Red 
          }

      - name: 5. Indirmeleri Z: Surucusune Yonlendir
        shell: pwsh
        run: |
          Write-Host "=== YONLENDIRME ==="
          if (Test-Path "Z:\") {
            New-Item -ItemType Directory -Force "Z:\Downloads", "Z:\Temp" | Out-Null
            
            $dl = "C:\Users\Draghyper\Downloads"
            if (Test-Path $dl) { Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $dl "Z:\Downloads"
            
            $tmp = $env:TEMP
            if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $tmp "Z:\Temp"
            
            Write-Host "[OK] Indirmeler ve Temp Z: diskine yonlendirildi."
          } else {
            Write-Host "Z: yok, yonlendirme atlanıyor."
          }

      - name: 6. Tailscale Kur ve Baglan
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== TAILSCALE ==="
          curl.exe -sL -o "$env:TEMP\ts.msi" "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait
          
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="gh-$env:GITHUB_RUN_ID"
          
          Start-Sleep -Seconds 5
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          Write-Host "=========================================="
          Write-Host "BAGLANMAYA HAZIR!"
          Write-Host "IP   : $ip"
          Write-Host "User : Draghyper"
          Write-Host "Pass : (RDP_PASSWORD secret'in)"
          Write-Host "=========================================="

      - name: 7. Sistemi 6 Saat Acik Tut
        shell: pwsh
        run: |
          Write-Host "Sistem 6 saat acik kalacak. IP: $env:RDP_IP"
          Write-Host "IP gorununce hemen baglan, bu adimin bitmesini BEKLEME!"
          for ($i = 1; $i -le 360; $i++) { 
            Start-Sleep -Seconds 60 
          }