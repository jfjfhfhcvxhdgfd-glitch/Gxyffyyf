name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret eksik."
          }
          if ($env:RDP_PASSWORD.Length -lt 12 -or
              $env:RDP_PASSWORD -notmatch '[A-Z]' -or
              $env:RDP_PASSWORD -notmatch '[a-z]' -or
              $env:RDP_PASSWORD -notmatch '\d' -or
              $env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD en az 12 karakter; buyuk harf, kucuk harf, rakam ve sembol icermeli."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret eksik."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_URL)) {
            throw "CLOUD_URL secret eksik."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_USER)) {
            throw "CLOUD_USER secret eksik."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_PASS)) {
            throw "CLOUD_PASS secret eksik."
          }
          Write-Host "Gerekli secret kontrolleri tamamlandi."

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Draghyper" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name "Draghyper" `
              -Password $securePassword `
              -Description "RDP account" | Out-Null
          } else {
            Set-LocalUser -Name "Draghyper" -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpPath -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpPath -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -Name "RDP-Tailscale" `
              -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" `
              -DisplayName "RDP over Tailscale" `
              -Direction Inbound -Protocol TCP -LocalPort 3389 `
              -Action Allow | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "Windows RDP ayarlari tamamlandi."

      - name: Enable RDP Audio and Microphone Redirection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null

          New-ItemProperty -Path $policyPath `
            -Name fDisableAudioCapture -PropertyType DWord `
            -Value 0 -Force | Out-Null

          New-ItemProperty -Path $policyPath `
            -Name fDisableAudioPlayback -PropertyType DWord `
            -Value 0 -Force | Out-Null

          foreach ($serviceName in @("AudioEndpointBuilder", "Audiosrv")) {
            $service = Get-Service -Name $serviceName `
              -ErrorAction SilentlyContinue

            if ($null -ne $service) {
              try {
                Set-Service -Name $serviceName -StartupType Automatic `
                  -ErrorAction Stop
                Start-Service -Name $serviceName -ErrorAction Stop
                Write-Host "$serviceName baslatildi."
              } catch {
                Write-Warning "$serviceName baslatilamadi: $($_.Exception.Message)"
              }
            }
          }

          gpupdate /target:computer /force
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3
          Write-Host "RDP servisi ses yonlendirme ilkelerinden sonra yeniden baslatildi."

      - name: Free Temporary Disk Space
        shell: pwsh
        run: |
          $tempPaths = @(
            $env:TEMP,
            "$env:WINDIR\Temp"
          )

          foreach ($path in $tempPaths) {
            if (Test-Path $path) {
              Get-ChildItem -LiteralPath $path -Force `
                -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Disk space after cleanup:"
          Get-PSDrive C

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:TEMP "tailscale-setup.msi"
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale kurulumu basarisiz. Kod: $($process.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw "Tailscale programi bulunamadi."
          }

          "TAILSCALE_EXE=$tailscale" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $env:TAILSCALE_EXE up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale girisi basarisiz. Auth key ve cihaz politikasini kontrol et."
          }

          Start-Sleep -Seconds 5
          $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IPv4 adresi alinamadi."
          }

          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale baglantisi hazir."
          Write-Host "RDP IP: $ip"
          Write-Host "Kullanici adi: Draghyper"

      - name: Install Rclone and Mount WebDAV as Z: Drive
        shell: pwsh
        env:
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Rclone indiriliyor..."
          curl.exe -sL `
            -o "$env:TEMP\rclone.zip" `
            "https://downloads.rclone.org/rclone-current-windows-amd64.zip"

          Expand-Archive `
            -Path "$env:TEMP\rclone.zip" `
            -DestinationPath "$env:TEMP\rclone" -Force

          $rcloneDir = Get-ChildItem `
            -Path "$env:TEMP\rclone" `
            -Filter "rclone-*-windows-amd64" | Select-Object -First 1

          $rcloneExe = Join-Path $rcloneDir.FullName "rclone.exe"
          $env:PATH += ";$($rcloneDir.FullName)"

          Write-Host "WebDAV yapilandiriliyor..."
          $env:RCLONE_CONFIG_MYDRIVE_TYPE = "webdav"
          $env:RCLONE_CONFIG_MYDRIVE_URL = $env:CLOUD_URL
          $env:RCLONE_CONFIG_MYDRIVE_USER = $env:CLOUD_USER
          $env:RCLONE_CONFIG_MYDRIVE_PASS = $env:CLOUD_PASS
          $env:RCLONE_CONFIG_MYDRIVE_VENDOR = "other"

          Write-Host "WebDAV baglaniyor..."
          Start-Process `
            -FilePath $rcloneExe `
            -ArgumentList "mount mydrive: Z: --vfs-cache-mode writes --volname 'Cloud Storage'" `
            -NoNewWindow -PassThru

          Start-Sleep -Seconds 15

          if (Test-Path "Z:\") {
            Write-Host "WebDAV Z: surucusune baglandi!" -ForegroundColor Green

            New-Item -ItemType Directory -Force -Path "Z:\Downloads" | Out-Null
            New-Item -ItemType Directory -Force -Path "Z:\Temp" | Out-Null

            $dl = "C:\Users\Draghyper\Downloads"
            if (Test-Path $dl) {
              Remove-Item $dl -Recurse -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J $dl "Z:\Downloads"

            $tmp = $env:TEMP
            if (Test-Path $tmp) {
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            }
            cmd /c mklink /J $tmp "Z:\Temp"

            Write-Host "Indirmeler Z: surucusune yonlendirildi." -ForegroundColor Green
          } else {
            Write-Host "UYARI: Z: surucusu baglanamadi. CLOUD_URL, USER veya PASS degerlerini kontrol et." -ForegroundColor Red
          }

      - name: Open Microsoft Store
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Microsoft Store aciliyor..."
          
          Start-Process "explorer.exe" -ArgumentList "shell:AppsFolder\Microsoft.WindowsStore_8wekyb3d8bbwe!App"
          
          Write-Host "Microsoft Store acildi. RDP ile baglandiktan sonra Store'dan Minecraft indirebilirsiniz." -ForegroundColor Green

      - name: Verify RDP and Audio Policies
        shell: pwsh
        run: |
          $rdp = Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Write-Host "RDP etkin: $($rdp.fDenyTSConnections -eq 0)"

          $policy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          $audio = Get-ItemProperty -Path $policy

          Write-Host "Mikrofon yonlendirmesi engellenmiyor: $($audio.fDisableAudioCapture -eq 0)"
          Write-Host "Ses cikisi yonlendirmesi engellenmiyor: $($audio.fDisableAudioPlayback -eq 0)"

          Get-NetTCPConnection -LocalPort 3389 -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

      - name: Maintain Connection
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "RDP oturumu 6 saate kadar acik tutulacak."
          Write-Host "Adres: $env:RDP_IP"
          Write-Host "Kullanici adi: Draghyper"
          Write-Host "Parola, GitHub RDP_PASSWORD secret degeridir."

          for ($i = 1; $i -le 360; $i++) {
            Write-Host "Baglanti aktif. Gecen sure: $i dakika"
            Start-Sleep -Seconds 60
          }