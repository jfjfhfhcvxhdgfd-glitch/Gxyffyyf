name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          $errors = @()
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { $errors += "RDP_PASSWORD missing" }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { $errors += "TAILSCALE_AUTH_KEY missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_URL)) { $errors += "CLOUD_URL missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_USER)) { $errors += "CLOUD_USER missing" }
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_PASS)) { $errors += "CLOUD_PASS missing" }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            throw "Secret check failed"
          }
          Write-Host "Secrets OK" -ForegroundColor Green

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $u = Get-LocalUser "Draghyper" -ErrorAction SilentlyContinue
          if (-not $u) { 
            New-LocalUser "Draghyper" -Password $pass -PasswordNeverExpires:$true | Out-Null 
          } else { 
            Set-LocalUser "Draghyper" -Password $pass 
          }
          Add-LocalGroupMember "Administrators" "Draghyper" -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          if (-not (Get-NetFirewallRule "RDP-Tailscale" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" -Direction Inbound `
              -Protocol TCP -LocalPort 3389 -Action Allow | Out-Null
          }
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force
          Write-Host "RDP OK" -ForegroundColor Green

      - name: Audio and Microphone
        shell: pwsh
        run: |
          $p = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $p -Force | Out-Null
          New-ItemProperty -Path $p -Name fDisableAudioCapture `
            -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $p -Name fDisableAudioPlayback `
            -PropertyType DWord -Value 0 -Force | Out-Null
          foreach ($s in @("AudioEndpointBuilder", "Audiosrv")) {
            $sv = Get-Service $s -ErrorAction SilentlyContinue
            if ($sv) { 
              try { Set-Service $s -StartupType Automatic; Start-Service $s } catch {} 
            }
          }
          gpupdate /target:computer /force
          Restart-Service TermService -Force
          Start-Sleep 3
          Write-Host "Audio OK" -ForegroundColor Green

      - name: Free Disk Space
        shell: pwsh
        run: |
          $paths = @($env:TEMP, "$env:WINDIR\Temp")
          foreach ($path in $paths) {
            if (Test-Path $path) { 
              Get-ChildItem $path -Force -ErrorAction SilentlyContinue | `
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 
            }
          }
          Write-Host "Disk cleaned" -ForegroundColor Green

      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          "TAILSCALE_EXE=$env:ProgramFiles\Tailscale\tailscale.exe" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Tailscale OK" -ForegroundColor Green

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & $env:TAILSCALE_EXE up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="gh-$env:GITHUB_RUN_ID"
          Start-Sleep 5
          $ip = (& $env:TAILSCALE_EXE ip -4 | Select-Object -First 1).Trim()
          "RDP_IP=$ip" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $ip" -ForegroundColor Green

      - name: Install WinFsp
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/winfsp/winfsp/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
          $msi = "$env:TEMP\winfsp.msi"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Write-Host "WinFsp OK" -ForegroundColor Green

      - name: Mount WebDAV Z Drive
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          CLOUD_URL: ${{ secrets.CLOUD_URL }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_PASS: ${{ secrets.CLOUD_PASS }}
        run: |
          $base = "C:\ProgramData\rclone"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          curl.exe -sL -o "$env:TEMP\r.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive "$env:TEMP\r.zip" "$env:TEMP\r" -Force
          $rdir = Get-ChildItem "$env:TEMP\r" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
          $exe = "$base\rclone.exe"
          Copy-Item "$($rdir.FullName)\rclone.exe" $exe -Force
          $obs = (& $exe obscure $env:CLOUD_PASS).Trim()
          $cfg = "$base\rclone.conf"
          $configLines = @(
            "[mydrive]",
            "type = webdav",
            "url = $($env:CLOUD_URL)",
            "vendor = other",
            "user = $($env:CLOUD_USER)",
            "pass = $obs"
          )
          $configLines | Set-Content $cfg -Encoding ASCII
          Write-Host "Testing connection..."
          & $exe lsd mydrive: --config $cfg --contimeout 30s --timeout 60s --retries 1 --log-level INFO 2>&1
          if ($LASTEXITCODE -ne 0) { 
            Write-Host "WARNING: Connection failed. Check URL/USER/PASS. RDP will still work." -ForegroundColor Yellow
            exit 0 
          }
          $script = "$base\mount.ps1"
          "if (!(Test-Path 'Z:\')) { & '$exe' mount mydrive: Z: --config '$cfg' --vfs-cache-mode writes --volname Cloud --network-mode }" | `
            Set-Content $script -Encoding ASCII
          schtasks.exe /Create /TN "RcloneMount" /SC ONLOGON /RU "Draghyper" /RP "$env:RDP_PASSWORD" `
            /TR "powershell -NoProfile -ExecutionPolicy Bypass -File `"$script`"" /F | Out-Null
          Start-Process powershell -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$script`"" -WindowStyle Hidden
          for ($i = 1; $i -le 30; $i++) { 
            if (Test-Path "Z:\") { Write-Host "Z: Drive OK" -ForegroundColor Green; break }
            Start-Sleep 1 
          }
          if (Test-Path "Z:\") {
            New-Item -ItemType Directory -Force "Z:\Downloads" | Out-Null
            $dl = "$env:USERPROFILE\Downloads"
            if (Test-Path $dl) { 
              $item = Get-Item $dl -Force
              if (($item.Attributes -band 1024) -eq 0) { 
                Remove-Item $dl -Recurse -Force
                cmd /c mklink /J "$dl" "Z:\Downloads" 
              } 
            }
            Write-Host "Downloads redirected to Z:" -ForegroundColor Green
          }

      - name: Microsoft Store
        shell: pwsh
        run: |
          $shell = New-Object -ComObject WScript.Shell
          $sc = $shell.CreateShortcut("$env:PUBLIC\Desktop\Microsoft Store.lnk")
          $sc.TargetPath = "explorer.exe"
          $sc.Arguments = "shell:AppsFolder\Microsoft.WindowsStore_8wekyb3d8bbwe!App"
          $sc.Save()
          Start-Process "explorer.exe" -ArgumentList "shell:AppsFolder\Microsoft.WindowsStore_8wekyb3d8bbwe!App"
          Write-Host "Store OK" -ForegroundColor Green

      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "RDP IP: $env:RDP_IP | User: Draghyper"
          for ($i = 1; $i -le 360; $i++) { Start-Sleep 60 }