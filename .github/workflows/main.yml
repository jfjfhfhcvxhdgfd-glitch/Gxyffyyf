name: RDP-TeraBox-Full-Mobil

on: [push, workflow_dispatch] # Hile: Dosyayı kaydedince otomatik çalışır!

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Secret Anahtarları Kontrol Et
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          Write-Host "=== GİZLİ ANAHTAR KONTROLÜ ==="
          $hatalar = @()
          
          # 1. RDP Şifresi Kontrolü
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { 
            $hatalar += "RDP_PASSWORD eksik! (Örn: Draghyper2026!)"
          } elseif ($env:RDP_PASSWORD.Length -lt 12) {
            $hatalar += "RDP_PASSWORD çok kısa! En az 12 karakter olmalı."
          } else {
            Write-Host "[OK] RDP_PASSWORD hazır."
          }

          # 2. Tailscale Auth Key Kontrolü
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { 
            $hatalar += "TAILSCALE_AUTH_KEY eksik!"
          } elseif ($env:TAILSCALE_AUTH_KEY -notmatch '^tskey-auth-') {
            $hatalar += "TAILSCALE_AUTH_KEY YANLIŞ! API key değil, Auth key olmalı (tskey-auth- ile başlamalı)."
          } else {
            Write-Host "[OK] TAILSCALE_AUTH_KEY hazır."
          }

          # 3. TeraBox Cookie Kontrolü
          if ([string]::IsNullOrWhiteSpace($env:CLOUD_COOKIE)) { 
            $hatalar += "CLOUD_COOKIE eksik! (TeraBox ndus çerezi)"
          } else {
            Write-Host "[OK] CLOUD_COOKIE hazır."
          }

          if ($hatalar.Count -gt 0) {
            Write-Host "HATALAR BULUNDU:" -ForegroundColor Red
            $hatalar | ForEach-Object { Write-Host "- $_" -ForegroundColor Red }
            throw "Lütfen Settings > Secrets kısmından eksikleri ekle."
          }
          Write-Host "Tüm anahtarlar doğru! Devam ediliyor..." -ForegroundColor Green

      - name: 2. Windows RDP ve Kullanıcı Ayarla
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name "Draghyper" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            New-LocalUser -Name "Draghyper" -Password $securePassword -Description "RDP User" | Out-Null
          } else {
            Set-LocalUser -Name "Draghyper" -Password $securePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member "Draghyper" -ErrorAction SilentlyContinue

          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force
          Write-Host "RDP ve Draghyper kullanıcısı hazır."

      - name: 3. Ses ve Mikrofonu Aç
        shell: pwsh
        run: |
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name fDisableAudioCapture -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name fDisableAudioPlayback -PropertyType DWord -Value 0 -Force | Out-Null
          Restart-Service -Name TermService -Force
          Write-Host "Ses ve mikrofon yönlendirmesi açıldı."

      - name: 4. Rclone İndir ve Kur
        shell: pwsh
        run: |
          curl.exe -sL -o "$env:TEMP\rclone.zip" "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          Expand-Archive -Path "$env:TEMP\rclone.zip" -DestinationPath "$env:TEMP\rclone" -Force
          $rcloneDir = Get-ChildItem -Path "$env:TEMP\rclone" -Filter "rclone-*-windows-amd64" | Select-Object -First 1
          $rcloneExe = Join-Path $rcloneDir.FullName "rclone.exe"
          $env:PATH += ";$($rcloneDir.FullName)"
          "RCLONE_EXE=$rcloneExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Rclone kuruldu."

      - name: 5. TeraBox'ı Z: Sürücüsü Olarak Bağla
        shell: pwsh
        env:
          CLOUD_COOKIE: ${{ secrets.CLOUD_COOKIE }}
        run: |
          Write-Host "TeraBox çerezi (ndus) ile bağlanılıyor..."
          $env:RCLONE_CONFIG_MYCLOUD_TYPE = "terabox"
          $env:RCLONE_CONFIG_MYCLOUD_NDUS = $env:CLOUD_COOKIE
          
          Start-Process -FilePath $env:RCLONE_EXE -ArgumentList "mount mycloud: Z: --vfs-cache-mode writes --volname 'TeraBox 1TB'" -NoNewWindow -PassThru
          Start-Sleep -Seconds 15
          
          if (Test-Path "Z:\") {
            Write-Host "[OK] TeraBox Z: sürücüsüne başarıyla bağlandı!" -ForegroundColor Green
          } else {
            Write-Host "[HATA] Z: sürücüsü bağlanamadı. Çerez (ndus) süresi dolmuş olabilir." -ForegroundColor Red
          }

      - name: 6. İndirmeleri Z: Sürücüsüne Yönlendir
        shell: pwsh
        run: |
          if (Test-Path "Z:\") {
            New-Item -ItemType Directory -Force -Path "Z:\Downloads" | Out-Null
            New-Item -ItemType Directory -Force -Path "Z:\Temp" | Out-Null
            
            $userDownloads = "C:\Users\Draghyper\Downloads"
            if (Test-Path $userDownloads) { Remove-Item -Path $userDownloads -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $userDownloads "Z:\Downloads"
            
            $sysTemp = $env:TEMP
            if (Test-Path $sysTemp) { Remove-Item -Path $sysTemp -Recurse -Force -ErrorAction SilentlyContinue }
            cmd /c mklink /J $sysTemp "Z:\Temp"
            Write-Host "İndirmeler ve Temp klasörü Z: (TeraBox) diskine yönlendirildi."
          }

      - name: 7. Tailscale Kur ve Bağlan
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msi = Join-Path $env:TEMP "tailscale-setup.msi"
          curl.exe -sL -o $msi "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          & $tailscale up --auth-key="$env:TAILSCALE_AUTH_KEY" --hostname="$hostname"
          
          Start-Sleep -Seconds 5
          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          "RDP_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          Write-Host "============================================"
          Write-Host "BAĞLANMAYA HAZIR!"
          Write-Host "IP: $ip"
          Write-Host "User: Draghyper"
          Write-Host "Pass: (RDP_PASSWORD secret'ın)"
          Write-Host "============================================"

      - name: 8. Sistemi 6 Saat Açık Tut
        shell: pwsh
        run: |
          Write-Host "Sistem 6 saat boyunca açık kalacak. IP: $env:RDP_IP"
          for ($i = 1; $i -le 360; $i++) { Start-Sleep -Seconds 60 }